<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a120c" />
    <meta
      name="description"
      content="Библиотека: Книжный порядок — увлекательная игра-сортировка книг по полкам"
    />
    <title>Библиотека: Книжный порядок</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234a3b2a'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle'%3E📚%3C/text%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(12, 23, 24, 0.96), rgba(37, 24, 16, 0.98)),
          #101819;
        color: #f5ecd6;
      }

      body {
        font-family: Georgia, "Times New Roman", serif;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      .loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(115deg, transparent 0 34%, rgba(239, 216, 143, 0.08) 35% 36%, transparent 37% 100%),
          repeating-linear-gradient(90deg, rgba(245, 236, 214, 0.03) 0 1px, transparent 1px 78px),
          linear-gradient(135deg, rgba(10, 25, 27, 0.98), rgba(44, 28, 18, 0.98) 58%, rgba(14, 18, 15, 0.98));
        opacity: 1;
        transition: opacity 0.3s ease;
      }

      .loading-screen.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-content {
        width: min(100% - 32px, 420px);
        text-align: center;
      }

      .loading-books {
        font-size: 3.8rem;
        line-height: 1;
        filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.35));
        animation: loadingBounce 1s ease-in-out infinite;
      }

      .loading-text {
        margin-top: 18px;
        color: #efd88f;
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 1.25;
        overflow-wrap: break-word;
      }

      .loading-status {
        margin-top: 8px;
        color: #c7b58d;
        font-size: 0.85rem;
        font-weight: 500;
      }

      @keyframes loadingBounce {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-14px);
        }
      }
    </style>
  </head>
  <body>
    <!-- Экран загрузки -->
    <div class="loading-screen" id="loading-screen">
      <div class="loading-content">
        <div class="loading-books">📚</div>
        <div class="loading-text" data-i18n="loading">Библиотека: Книжный порядок</div>
        <div class="loading-status" data-i18n="loadingStatus">Загрузка…</div>
      </div>
    </div>

    <!-- Основное приложение -->
    <div id="app"></div>

    <!-- Canvas для частиц -->
    <canvas id="particles"></canvas>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
