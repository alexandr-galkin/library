<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a120c" />
    <meta
      name="description"
      content="Разбери Хаос — увлекательная игра-сортировка книг по полкам"
    />
    <title>Разбери Хаос — Библиотека</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234a3b2a'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle'%3E📚%3C/text%3E%3C/svg%3E"
    />

    <style>
      /* ============ БАЗОВЫЕ СТИЛИ ============ */
      :root {
        --wood-dark: #3d2b1f;
        --wood-mid: #5c4033;
        --wood-light: #8b6914;
        --paper: #f5f0e6;
        --paper-dark: #e8e0d0;
        --gold: #c9a227;
        --gold-light: #e8d48b;
        --text: #f5f0e6;
        --text2: #b8a88a;
        --accent: #c9a227;
        --accent2: #8b6914;
        --shadow: rgba(0, 0, 0, 0.5);
        --success: #4ecca3;
        --warning: #f9a825;
        --danger: #e94560;
        --bg-dark: #1a120c;
        --bg-mid: #2a1f15;
        --bg-light: #3d2b1f;
        --border-color: rgba(139, 105, 20, 0.3);
        --border-hover: rgba(201, 162, 39, 0.5);
        --text-muted: #8b7b6b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg-dark);
        color: var(--text);
        touch-action: manipulation;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }

      canvas#particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1000;
      }

      /* ============ ЭКРАН ЗАГРУЗКИ ============ */
      .loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-dark);
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      .loading-content {
        text-align: center;
      }

      .loading-books {
        font-size: 4rem;
        animation: loadingBounce 1s ease-in-out infinite;
      }

      .loading-text {
        margin-top: 20px;
        font-size: 1.2rem;
        color: var(--gold);
        font-weight: 600;
      }

      @keyframes loadingBounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      /* ============ МЕНЮ ============ */
      .menu-overlay {
        position: absolute;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          #1a120c 0%,
          #2a1f15 50%,
          #1a120c 100%
        );
        overflow: hidden;
      }

      .menu-container {
        position: relative;
        width: 100%;
        max-width: 480px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .menu-background {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .menu-particles {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            circle at 20% 80%,
            rgba(201, 162, 39, 0.1) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(139, 105, 20, 0.15) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 50% 50%,
            rgba(61, 43, 31, 0.3) 0%,
            transparent 70%
          );
        animation: pulseBackground 4s ease-in-out infinite;
      }

      @keyframes pulseBackground {
        0%,
        100% {
          opacity: 0.8;
        }
        50% {
          opacity: 1;
        }
      }

      .menu-books-decoration {
        position: absolute;
        inset: 0;
      }

      .floating-book {
        position: absolute;
        font-size: 2rem;
        opacity: 0.3;
        filter: blur(1px);
        animation: floatBook 4s ease-in-out infinite;
      }

      .book-1 {
        top: 10%;
        left: 15%;
        animation-delay: 0s;
      }
      .book-2 {
        top: 20%;
        right: 20%;
        animation-delay: 0.5s;
      }
      .book-3 {
        bottom: 30%;
        left: 10%;
        animation-delay: 1s;
      }
      .book-4 {
        bottom: 20%;
        right: 15%;
        animation-delay: 1.5s;
      }
      .book-5 {
        top: 50%;
        left: 50%;
        animation-delay: 2s;
      }

      @keyframes floatBook {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        25% {
          transform: translateY(-20px) rotate(5deg);
        }
        50% {
          transform: translateY(0) rotate(0deg);
        }
        75% {
          transform: translateY(10px) rotate(-5deg);
        }
      }

      .menu-content {
        position: relative;
        z-index: 1;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }

      .menu-content.entered {
        opacity: 1;
        transform: translateY(0);
      }

      .menu-header {
        text-align: center;
      }

      .menu-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-bottom: 12px;
      }

      .logo-icon {
        font-size: 3rem;
        animation: bounce 2s ease-in-out infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .logo-text {
        text-align: left;
      }

      .menu-title {
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 1px;
        background: linear-gradient(
          135deg,
          #e8d48b 0%,
          #c9a227 50%,
          #e8d48b 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: none;
        margin: 0;
      }

      .menu-subtitle {
        font-size: 1rem;
        color: #b8a88a;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .menu-description {
        font-size: 0.9rem;
        color: #8b7b6b;
        line-height: 1.6;
        margin: 0;
      }

      .menu-stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        width: 100%;
      }

      .stat-card {
        background: linear-gradient(
          135deg,
          rgba(61, 43, 31, 0.8),
          rgba(42, 31, 21, 0.8)
        );
        border: 1px solid rgba(139, 105, 20, 0.3);
        border-radius: 16px;
        padding: 16px 12px;
        text-align: center;
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .stat-card:hover {
        transform: translateY(-4px);
        border-color: rgba(201, 162, 39, 0.5);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }

      .stat-icon {
        font-size: 1.5rem;
        margin-bottom: 8px;
      }

      .stat-value {
        font-size: 1.4rem;
        font-weight: 800;
        color: #e8d48b;
        margin-bottom: 4px;
      }

      .stat-label {
        font-size: 0.7rem;
        color: #8b7b6b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
      }

      .play-button {
        position: relative;
        padding: 18px 24px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #c9a227 0%, #b8860b 100%);
        color: #2a1f15;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .play-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(201, 162, 39, 0.4);
      }

      .play-button:active {
        transform: scale(0.98);
      }

      .play-button.clicked {
        animation: buttonClick 0.3s ease;
      }

      @keyframes buttonClick {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(0.95);
        }
        100% {
          transform: scale(1);
        }
      }

      .play-icon {
        font-size: 1.3rem;
      }

      .play-shine {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          45deg,
          transparent 40%,
          rgba(255, 255, 255, 0.3) 50%,
          transparent 60%
        );
        animation: shine 3s infinite;
      }

      @keyframes shine {
        0% {
          transform: translateX(-100%) rotate(45deg);
        }
        100% {
          transform: translateX(100%) rotate(45deg);
        }
      }

      .settings-button {
        padding: 14px 24px;
        border: 1px solid rgba(139, 105, 20, 0.4);
        border-radius: 16px;
        background: rgba(61, 43, 31, 0.6);
        color: #b8a88a;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .settings-button:hover {
        background: rgba(61, 43, 31, 0.8);
        border-color: rgba(201, 162, 39, 0.6);
        color: #e8d48b;
      }

      .menu-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        padding: 0 4px;
      }

      .version {
        font-size: 0.7rem;
        color: #5c4a3a;
      }

      .hint {
        font-size: 0.75rem;
        color: #8b7b6b;
        animation: hintPulse 2s ease-in-out infinite;
      }

      @keyframes hintPulse {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      /* ============ НАСТРОЙКИ ============ */
      .settings-content {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 400px;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }

      .settings-content.entered {
        opacity: 1;
        transform: translateY(0);
      }

      .settings-header {
        text-align: center;
        margin-bottom: 32px;
      }

      .settings-title {
        font-size: 1.8rem;
        font-weight: 800;
        color: #e8d48b;
        margin: 0 0 8px 0;
      }

      .settings-subtitle {
        font-size: 0.9rem;
        color: #8b7b6b;
      }

      .settings-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 32px;
      }

      .setting-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px;
        background: rgba(61, 43, 31, 0.6);
        border: 1px solid rgba(139, 105, 20, 0.2);
        border-radius: 16px;
        transition: all 0.3s ease;
      }

      .setting-item:hover {
        border-color: rgba(201, 162, 39, 0.4);
      }

      .setting-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .setting-icon {
        font-size: 1.5rem;
      }

      .setting-text {
        display: flex;
        flex-direction: column;
      }

      .setting-name {
        font-size: 0.95rem;
        font-weight: 600;
        color: #e8d48b;
      }

      .setting-desc {
        font-size: 0.75rem;
        color: #8b7b6b;
        margin-top: 2px;
      }

      .toggle-switch {
        width: 52px;
        height: 28px;
        background: rgba(42, 31, 21, 0.8);
        border-radius: 14px;
        position: relative;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid rgba(139, 105, 20, 0.3);
      }

      .toggle-switch.active {
        background: #c9a227;
        border-color: #b8860b;
      }

      .toggle-slider {
        width: 20px;
        height: 20px;
        background: #b8a88a;
        border-radius: 50%;
        position: absolute;
        top: 2px;
        left: 2px;
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }

      .toggle-switch.active .toggle-slider {
        left: 26px;
        background: #fff;
      }

      .back-button {
        width: 100%;
        padding: 14px;
        border: 1px solid rgba(139, 105, 20, 0.4);
        border-radius: 16px;
        background: rgba(61, 43, 31, 0.6);
        color: #b8a88a;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .back-button:hover {
        background: rgba(61, 43, 31, 0.8);
        border-color: rgba(201, 162, 39, 0.6);
        color: #e8d48b;
      }

      .back-icon {
        font-size: 1.2rem;
      }

      /* ============ ЗАВЕРШЕНИЕ УРОВНЯ ============ */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(26, 18, 12, 0.85);
        backdrop-filter: blur(12px);
        padding: 20px;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal-card {
        background: linear-gradient(180deg, #4a3525, #3d2b1f);
        border: 2px solid #5c4033;
        border-radius: 20px;
        padding: 28px;
        max-width: 360px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        text-align: center;
        animation: modalIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }

      @keyframes modalIn {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* ============ ИГРОВОЙ ИНТЕРФЕЙС ============ */
      .library-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: linear-gradient(
          180deg,
          #2a1f15 0%,
          #3d2b1f 40%,
          #4a3525 100%
        );
        overflow: hidden;
      }

      .game-table {
        position: absolute;
        bottom: 18%;
        left: 50%;
        transform: translateX(-50%);
        width: 92%;
        max-width: 720px;
        height: 22%;
        background: linear-gradient(180deg, #6b4e31, #5c4033);
        border-radius: 12px 12px 4px 4px;
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.5),
          inset 0 2px 4px rgba(255, 255, 255, 0.05);
        z-index: 10;
      }

      .hud-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        background: linear-gradient(
          180deg,
          rgba(26, 18, 12, 0.9),
          rgba(26, 18, 12, 0.6)
        );
        backdrop-filter: blur(8px);
      }

      .hud-actions {
        display: flex;
        flex-direction: row;
        align-items: center;
      }

      .hud-item {
        font-size: 0.8rem;
        font-weight: 600;
        color: #b8a88a;
      }

      .hud-item span {
        color: #e8d48b;
        font-weight: 800;
      }

      .rule-banner {
        position: absolute;
        top: 72px;
        left: 50%;
        transform: translateX(-50%);

        background: linear-gradient(
          135deg,
          rgba(74, 53, 37, 0.95),
          rgba(61, 43, 31, 0.95)
        );

        border: 1px solid #5c4033;
        border-radius: 12px;
        padding: 10px 20px;
        text-align: center;
        z-index: 40;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);

        width: fit-content;
        max-width: calc(100vw - 24px);
      }

      .objects-zone {
        position: absolute;
        bottom: 42%;
        left: 50%;
        transform: translateX(-50%);
        width: 88%;
        max-width: 680px;
        height: 14%;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        align-items: center;
        z-index: 20;
        padding: 8px;
      }

      .containers-zone {
        position: absolute;
        bottom: 2%;
        left: 50%;
        transform: translateX(-50%);
        width: 96%;
        max-width: 760px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 8px;
        z-index: 20;
        padding: 8px;
      }

      .shelf-container {
        background: linear-gradient(180deg, #4a3525, #3d2b1f);
        border: 2px solid #5c4033;
        border-radius: 12px;
        box-shadow:
          inset 0 2px 8px rgba(0, 0, 0, 0.4),
          0 4px 12px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
        transition:
          border-color 0.3s,
          box-shadow 0.3s;
      }

      .book-item {
        cursor: grab;
        user-select: none;
        touch-action: none;
        transition:
          transform 0.15s,
          filter 0.15s;
        position: relative;
        z-index: 20;
      }

      .book-item:hover {
        transform: translateY(-4px) scale(1.05);
        filter: brightness(1.1);
      }

      .book-item.dragging {
        position: fixed !important;
        z-index: 1000 !important;
        transform: scale(1.12) rotate(3deg) !important;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.5)) brightness(1.15) !important;
        pointer-events: none;
      }

      /* ============ АДАПТИВНОСТЬ ============ */
      @media (max-width: 425px) {
        .hud-bar {
          display: flex;
          flex-direction: column;
        }
        .menu-button {
          min-height: 0 !important;
          padding: 6px 10px !important;
          font-size: 12px !important;
        }
        .hud-actions {
          display: flex;
          gap: 5px;
        }
        .menu-title {
          font-size: 1.5rem;
        }

        .logo-icon {
          font-size: 2.5rem;
        }

        .stat-card {
          padding: 12px 8px;
        }

        .stat-value {
          font-size: 1.1rem;
        }

        .play-button {
          font-size: 1rem;
          padding: 16px 20px;
        }

        .library-window {
          display: none;
        }

        .library-lamp {
          transform: scale(0.7);
        }

        .library-plant {
          transform: scale(0.7);
          right: 2%;
        }

        .objects-zone {
          gap: 8px;
        }
      }

      @media (max-width: 600px) {
        .rule-banner {
          top: 120px !important;
          width: calc(100vw - 16px);
          max-width: none;

          padding: 8px 12px;
          border-radius: 10px;
        }

        .rule-banner h2 {
          font-size: 16px;
          line-height: 1.2;
          margin: 0;
        }

        .rule-banner .sub {
          font-size: 12px;
          margin-top: 4px;
        }
        .game-table {
          top: 45% !important;
          height: 100% !important;
          max-height: 70% !important;
        }
        .containers-zone {
          grid-template-columns: repeat(4, 1fr) !important;
        }

        .objects-zone {
          width: 96%;
          height: 18%;
          bottom: 40%;
          gap: 8px;
          padding: 4px;
        }

        .containers-zone {
          width: 100%;
          bottom: 1%;
          padding: 4px;
          gap: 6px;

          grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        }

        .shelf-container {
          border-width: 1px;
          border-radius: 10px;
        }

        .book-item:hover {
          transform: none;
          filter: none;
        }

        .book-item.dragging {
          transform: scale(1.08) !important;
        }
      }

      @media (min-width: 1024px) {
        .game-table {
          width: 70%;
        }

        .objects-zone {
          width: 65%;
        }

        .containers-zone {
          width: 70%;
          grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Экран загрузки -->
    <div class="loading-screen" id="loading-screen">
      <div class="loading-content">
        <div class="loading-books">📚</div>
        <div class="loading-text">Разбери Хаос</div>
      </div>
    </div>

    <!-- Основное приложение -->
    <div id="app"></div>

    <!-- Canvas для частиц -->
    <canvas id="particles"></canvas>

    <script type="module" src="/src/main.js"></script>

    <script>
      // Скрыть экран загрузки после инициализации
      window.addEventListener("load", () => {
        setTimeout(() => {
          const loadingScreen = document.getElementById("loading-screen");
          if (loadingScreen) {
            loadingScreen.style.opacity = "0";
            loadingScreen.style.transition = "opacity 0.3s ease";
            setTimeout(() => {
              loadingScreen.remove();
            }, 300);
          }
        }, 500);
      });
    </script>
  </body>
</html>
