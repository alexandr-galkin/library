<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a120c">
  <meta name="description" content="Книжный порядок — увлекательная игра-сортировка книг по полкам">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Библиотека: Книжный порядок</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234a3b2a'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle'%3E📚%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/styles/main.css">
  <style>
    /* Критические стили для быстрой загрузки */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: #1a120c;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f5f0e6;
      touch-action: manipulation;
    }
    
    #app { 
      width: 100%; 
      height: 100%; 
      position: relative; 
    }
    
    canvas#particles { 
      position: fixed; 
      inset: 0; 
      pointer-events: none; 
      z-index: 1000; 
    }
    
    /* Скелетон загрузки */
    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a120c;
      z-index: 9999;
    }
    
    .loading-content {
      text-align: center;
    }
    
    .loading-books {
      font-size: 4rem;
      animation: loadingBounce 1s ease-in-out infinite;
    }
    
    .loading-text {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #c9a227;
      font-weight: 600;
    }
    
    .loading-bar {
      width: 200px;
      height: 4px;
      background: rgba(201,162,39,0.2);
      border-radius: 2px;
      margin: 20px auto 0;
      overflow: hidden;
    }
    
    .loading-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #c9a227, #e8d48b);
      border-radius: 2px;
      animation: loadingFill 1.5s ease-in-out infinite;
    }
    
    @keyframes loadingBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    
    @keyframes loadingFill {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      * { 
        animation-duration: 0.01ms !important; 
        transition-duration: 0.01ms !important; 
      }
    }
  </style>
</head>
<body>
  <!-- Экран загрузки -->
  <div class="loading-screen" id="loading-screen">
    <div class="loading-content">
      <div class="loading-books">📚</div>
      <div class="loading-text" data-i18n="loading">
  Библиотека: Книжный порядок
</div>
      <div class="loading-bar">
        <div class="loading-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Основное приложение -->
  <div id="app"></div>
  
  <!-- Canvas для частиц -->
  <canvas id="particles"></canvas>
  
  <script type="module" src="/src/main.js"></script>
  
  <script>
    // Скрыть экран загрузки после инициализации
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          loadingScreen.style.transition = 'opacity 0.3s ease';
          setTimeout(() => {
            loadingScreen.remove();
          }, 300);
        }
      }, 500);
    });
  </script>
</body>
</html>
